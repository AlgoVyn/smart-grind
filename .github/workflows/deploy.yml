name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Gate PRs with the same checks (minus the deploy step)
  pull_request:
    branches:
      - main

concurrency:
  # Rapid pushes to main must not race deploys out of order
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Lint
        run: npm run lint
        working-directory: website

      - name: Type check
        run: npm run type-check
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website

      - name: Build offline bundle
        run: npm run build:bundle
        working-directory: website

      - name: Run tests
        run: npm test
        working-directory: website

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build && npm run build:bundle
        working-directory: website

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=smart-grind
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional useful flags:
          # --branch=${{ github.ref_name }}           # auto-sets branch name
          # --commit-hash=${{ github.sha }}
