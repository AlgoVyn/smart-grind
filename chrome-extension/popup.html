<!DOCTYPE html>
<html>
<head>
  <title>SmartGrind</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #020617;
      --muted: #475569;
      --border: #94a3b8;
      --brand: #006bb3;
      --focus: rgba(0, 107, 179, 0.28);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --card: #1e293b;
        --text: #ffffff;
        --muted: #94a3b8;
        --border: #64748b;
        --brand: #0085d0;
        --focus: rgba(0, 133, 208, 0.35);
      }
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      width: 280px;
      min-height: 250px;
      color: var(--text);
    }
    .container {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      margin-bottom: 6px;
    }
    h3 {
      color: var(--text);
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    #currentRating {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      color: var(--text);
      background: var(--card);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, button:focus-visible {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--focus);
    }
    button {
      background: #006bb3;
      color: #fff;
      border: none;
      min-height: 44px;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }
    button:hover {
      filter: brightness(1.05);
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo-48.png" alt="SmartGrind Logo" class="logo">
      <h3>SmartGrind</h3>
    </div>
    <div id="currentRating">Current Rating: --</div>
    <div class="form-group">
      <label for="minRating">Min Rating:</label>
      <input type="number" id="minRating" placeholder="0">
    </div>
    <div class="form-group">
      <label for="maxRating">Max Rating:</label>
      <input type="number" id="maxRating" placeholder="3000">
    </div>
    <div class="form-group">
      <label for="tagSelect">Tag:</label>
      <select id="tagSelect">
        <option value="">All Tags</option>
      </select>
    </div>
    <button id="randomBtn">Get Random Problem</button>
  </div>
  <script src="ratings-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
